name: shared wasm loader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/owls-loader.test.mjs
